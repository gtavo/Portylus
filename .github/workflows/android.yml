name: Android
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug assembleRelease bundleRelease testDebugUnitTest lintDebug assembleDebugAndroidTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: apk-and-reports
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/reports/
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          cores: 4
          emulator-boot-timeout: 300
          ram-size: 2048M
          disable-animations: true
          # The gesture suite uses fixed pixel coordinates and a fully visible tablet toolbar.
          # The phone toolbar is covered separately by compactToolbarKeepsTitleToolsAndDocumentActionsOnOneLine.
          script: |
            timeout 30s adb shell wm size 1280x800
            timeout 30s adb shell wm density 160
            timeout 30s adb shell wm size
            timeout 30s adb shell wm density
            timeout 10m ./gradlew connectedDebugAndroidTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports
          path: app/build/reports/androidTests/
