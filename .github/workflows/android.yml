name: Android
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug assembleRelease bundleRelease testDebugUnitTest lintDebug assembleDebugAndroidTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: apk-and-reports
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/reports/
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.ci-android-user
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - name: Bundletool for Play-style language regression
        run: |
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          cores: 4
          emulator-boot-timeout: 300
          ram-size: 2048M
          disable-animations: true
          # The gesture suite uses fixed pixel coordinates and a fully visible tablet toolbar.
          # Repeat the focused UI and language tests in a phone viewport below.
          script: |
            timeout 30s adb shell wm size 1280x800
            timeout 30s adb shell wm density 160
            timeout 30s adb shell wm size
            timeout 30s adb shell wm density
            timeout 10m ./gradlew connectedDebugAndroidTest --no-daemon --console=plain
            timeout 30s adb shell wm size 360x800
            timeout 30s adb shell wm density 160
            timeout 4m ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.gtavoapps.portylus.SearchWorkflowTest,com.gtavoapps.portylus.PdfSearchTest,com.gtavoapps.portylus.LanguageDeliveryTest,com.gtavoapps.portylus.MobileSettingsTest,com.gtavoapps.portylus.PenInputTest#responsiveToolbarKeepsActionsVisibleAndAllPrimaryToolsReachable --no-daemon --console=plain
            # A full APK contains every locale and cannot detect Play language-split bugs.
            timeout 3m ./gradlew bundleDebug --no-daemon --console=plain
            java -jar "$RUNNER_TEMP/bundletool.jar" get-device-spec --output="$RUNNER_TEMP/device.json"
            java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=app/build/outputs/bundle/debug/app-debug.aab --output="$RUNNER_TEMP/device.apks" --device-spec="$RUNNER_TEMP/device.json" --ks="$ANDROID_USER_HOME/debug.keystore" --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
            java -jar "$RUNNER_TEMP/bundletool.jar" install-apks --apks="$RUNNER_TEMP/device.apks"
            adb shell svc wifi disable
            adb shell svc data disable
            timeout 2m adb shell am instrument -w -r -e class com.gtavoapps.portylus.LanguageDeliveryTest com.gtavoapps.portylus.test/com.gtavoapps.portylus.PortylusTestRunner | tee app/build/reports/androidTests/play-languages.log
            grep -q 'OK (2 tests)' app/build/reports/androidTests/play-languages.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports
          path: app/build/reports/androidTests/
